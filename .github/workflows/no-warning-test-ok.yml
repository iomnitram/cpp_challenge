name: No warning an complete tests

on:
  push:
    branches: [ "*" ]

env:
  BUILD_TYPE: Release


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect_Challenges
        working-directory: ${{github.workspace}}/challenges
        run: ./detect.sh

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DALL_WARNINGS=ON -DWARNINGS_ERROR=ON

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}}